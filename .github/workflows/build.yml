name: Build Firmware

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pinned: the action defaults to `latest`, which would silently change the
      # compiler — and therefore the binary — from one run to the next.
      - name: Install Arm toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "13.2.Rel1"

      # dfu-util supplies dfu-suffix, which QMK runs to produce the .bin.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dfu-util

      # Build via the project Makefile rather than a parallel set of steps, so
      # CI uses exactly the QMK tag, module commit, qmk CLI version and build
      # flags that a local `make` uses. The Makefile clones and pins all three
      # itself (into .build/qmk_firmware and .build/venv), using the runner's
      # preinstalled python3 — no separate qmk/Python setup needed here.
      - name: Compile firmware
        run: make compile

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: |
            .build/qmk_firmware/*.bin
            .build/qmk_firmware/*.hex
            .build/qmk_firmware/*.uf2
